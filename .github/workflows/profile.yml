name: Profile Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: automated/profile-update-${{ github.run_id }}
  GIT_USER: Utkarsh-Singhal-26
  GIT_EMAIL: singhalutkarsh26@gmail.com

jobs:
  create-branch:
    runs-on: ubuntu-latest
    name: Create Branch

    steps:
      - uses: actions/checkout@v5

      - name: Create branch off main
        run: |
          git config user.name "${{ env.GIT_USER }}"
          git config user.email "${{ env.GIT_EMAIL }}"

          git checkout -b "${{ env.BRANCH }}"
          git push origin "${{ env.BRANCH }}"

  update-prs:
    runs-on: ubuntu-latest
    name: Update Open Source PRs
    needs: create-branch

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Fetch latest branch state
        run: git pull origin "${{ env.BRANCH }}"

      - name: Fetch the latest 5 merged PRs and render the card
        env:
          GITHUB_TOKEN: ${{ secrets.LATEST_PRS }}
          GH_USER: Utkarsh-Singhal-26
        run: |
          gh search prs \
            --author="$GH_USER" \
            --merged \
            --visibility=public \
            --limit 100 \
            --sort=created \
            --order=desc \
            --json repository,number,createdAt,title,url \
            --jq '
              map(
                select(
                  (.repository.nameWithOwner
                   | startswith(env.GH_USER + "/")) | not
                )
              )
              | .[:5]
            ' > prs.json

          python3 -m scripts.build_prs prs.json

      - name: Commit & push
        env:
          PAT: ${{ secrets.LATEST_PRS }}
        run: |
          git config user.name "${{ env.GIT_USER }}"
          git config user.email "${{ env.GIT_EMAIL }}"

          git add README.md cards

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update open source PRs"

          git push \
            https://x-access-token:${PAT}@github.com/${{ github.repository }}.git \
            "${{ env.BRANCH }}"

  waka-readme:
    runs-on: ubuntu-latest
    name: Update WakaTime Stats
    needs: update-prs

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Fetch latest branch state
        run: git pull origin "${{ env.BRANCH }}"

      - name: Fetch WakaTime stats and render the card
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: |
          # API keys stop working for non-plugin use on 2026-11-01; use a
          # personal OAuth token. -f fails the job on 4xx/5xx so a bad token
          # can't blank the README section.
          curl -sf \
            -H "Authorization: Bearer $WAKATIME_OAUTH_TOKEN" \
            "https://wakatime.com/api/v1/users/current/stats/all_time" \
            -o waka_raw.json

          python3 -c 'import json; assert json.load(open("waka_raw.json")).get("data")'

          python3 -m scripts.build_waka waka_raw.json

      - name: Commit & push
        env:
          PAT: ${{ secrets.LATEST_PRS }}
        run: |
          git config user.name "${{ env.GIT_USER }}"
          git config user.email "${{ env.GIT_EMAIL }}"

          git add cards/waka.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update wakatime stats"

          git push \
            https://x-access-token:${PAT}@github.com/${{ github.repository }}.git \
            "${{ env.BRANCH }}"

  update-stats:
    runs-on: ubuntu-latest
    name: Update GitHub Stats
    needs: waka-readme

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Fetch latest branch state
        run: git pull origin "${{ env.BRANCH }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Render GitHub cards
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: Utkarsh-Singhal-26
        run: python -m scripts.build_cards

      - name: Commit & push
        env:
          PAT: ${{ secrets.LATEST_PRS }}
        run: |
          git config user.name "${{ env.GIT_USER }}"
          git config user.email "${{ env.GIT_EMAIL }}"

          for path in cache cards/stats.svg cards/heatmap.svg cards/activity.svg cards/hero.svg cards/stack.svg; do
            git add "$path"
            git diff --cached --quiet || git commit -m "chore: update $(basename "$path" .svg)"
          done

          git push \
            https://x-access-token:${PAT}@github.com/${{ github.repository }}.git \
            "${{ env.BRANCH }}"

  open-pr:
    runs-on: ubuntu-latest
    name: Open Pull Request
    needs: update-stats

    steps:
      - uses: actions/checkout@v5

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.LATEST_PRS }}
        run: |
          gh pr create \
            --title "chore: daily profile update ($(date +%F))" \
            --body "$(cat <<EOF
          Automated daily update

          - Hero, heatmap, stack and activity cards
          - Open source PRs
          - WakaTime coding stats
          - GitHub stats (contributions, stars, LOC)
          EOF
          )" \
            --head "${{ env.BRANCH }}" \
            --base main \
          || echo "PR already exists"
